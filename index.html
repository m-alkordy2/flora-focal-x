<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="icon" href="./assets/img/logo.png" type="image/x-icon">
    <title>Flora</title>
</head>
<body>
    <header>
        <nav>
            <img src="./assets/img/full-logo.png" alt="flora logo" class="logo">
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Service</li>
                <li>New Property</li>
                <li>Contact</li>
            </ul>
            <button class="login">Login</button>
            <button class="bars-icon"><img src="./assets/img/berger.svg" alt="bars icon"></button>
        </nav>
        <div class="hero">
            <img src="./assets/img/hero-bg.png" alt="flat image" class="background">
            <h1>Discover a place you will love to live</h1>
            <p class="description">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Imperdiet tempus felis vitae sit est quisque.</p>
            <div class="info">
                <div class="card">
                    <div class="icon">
                        <img src="./assets/img/location.svg" alt="location icon">
                    </div>
                    <div class="text">
                        <h2>Location</h2>
                        <p>Ahmedabad, India</p>
                    </div>
                </div>
                <div class="card">
                    <div class="icon">
                        <img src="./assets/img/dollar-circle.svg" alt="dollar icon">
                    </div>
                    <div class="text">
                        <h2>Price</h2>
                        <p>$1000 - $10,000</p>
                    </div>
                </div>
                <div class="card">
                    <div class="icon">
                        <img src="./assets/img/house.svg" alt="house icon">
                    </div>
                    <div class="text">
                        <h2>Type of Property</h2>
                        <p>Apartment</p>
                    </div>
                </div>
            </div>
        </div>
    </header>
</body>
</html>
